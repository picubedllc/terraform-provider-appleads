# Unsigned GoReleaser dry-run. Confirms Registry zip naming without GPG or GitHub Releases.
name: Release snapshot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.goreleaser.yml'
      - 'terraform-registry-manifest.json'
      - 'GNUmakefile'
      - 'scripts/verify-release-artifacts.sh'
      - '.github/workflows/release-snapshot.yml'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.goreleaser.yml'
      - 'terraform-registry-manifest.json'
      - 'GNUmakefile'
      - 'scripts/verify-release-artifacts.sh'
      - '.github/workflows/release-snapshot.yml'
      - 'main.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  snapshot:
    name: GoReleaser snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --snapshot --clean --skip=sign
      - name: Verify Registry artifact names
        run: ./scripts/verify-release-artifacts.sh
